variables:
  IMAGE_NAME: "registry.example.com/acw/acw"

stages:
  - test
  - build
  - deploy

test:
  stage: test
  image: node:22-alpine
  script:
    - npm ci
    - node --check src/server.js
    - node --check src/config.js

build:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  script:
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHA -t $IMAGE_NAME:latest .
  only:
    - main

deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl rollout status deployment/acw -n acw --timeout=180s
  only:
    - main
