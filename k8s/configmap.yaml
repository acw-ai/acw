apiVersion: v1
kind: ConfigMap
metadata:
  name: acw-config
  namespace: acw
data:
  # Network & Environment
  PORT: "3100"
  HOST: "0.0.0.0"
  NODE_ENV: "production"
  COOKIE_SECURE: "true"
  SESSION_HOURS: "8760"

  # Database settings
  DB_DRIVER: "mysql"
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "acw_db"
  MYSQL_USER: "acw_user"
  DB_AUTO_MIGRATE: "true"

  # Business Logic & PBX Rules
  MONITORED_EXTENSIONS: "" # Empty monitors all extensions
  ENFORCE_DISPOSITION: "true"
  REQUIRE_UNANSWERED_OUTBOUND: "true"
  SKIP_INTERNAL_CALLS: "true"
  INTERNAL_NUMBER_MAX_LENGTH: "4"
  GUARD_INTERVAL_MS: "20000"
