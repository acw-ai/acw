apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acw-ingress
  namespace: acw
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "acw-svc"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - acw.example.com
      secretName: acw-tls
  rules:
    - host: acw.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: acw-svc
                port:
                  number: 80
